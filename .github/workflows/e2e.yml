name: End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          e2e/package-lock.json

    - name: Install backend dependencies & set up venv
      working-directory: backend
      run: |
        python3 -m venv .venv
        ./.venv/bin/pip install -r requirements.txt

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install E2E dependencies
      working-directory: e2e
      run: npm ci

    - name: Install Playwright Chromium with dependencies
      working-directory: e2e
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      working-directory: e2e
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

  deploy:
    name: Deploy & Verify on Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Запуск деплоя на Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Verify Live Service Status (Smoke Test)
        run: |
          RENDER_APP_URL="${{ secrets.RENDER_APP_URL || vars.RENDER_APP_URL }}"
          if [ -z "$RENDER_APP_URL" ]; then
            echo "Внимание: Переменная RENDER_APP_URL не задана в GitHub Secrets/Variables."
            echo "Автоматическая верификация (Smoke Test) пропущена."
            exit 0
          fi
          
          # Убираем возможный слеш на конце для корректности путей
          RENDER_APP_URL=$(echo "$RENDER_APP_URL" | sed 's/\/$//')
          echo "Ожидание успешного деплоя сервиса на $RENDER_APP_URL..."
          
          # Опрашиваем URL каждые 15 секунд в течение 10 минут (40 попыток)
          for i in {1..40}; do
            # Проверяем успешность отдачи фронтенда (HTTP 200) и работоспособность API
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$RENDER_APP_URL/api/event-types" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Сервис успешно деплоирован и отвечает на запросы (HTTP 200)!"
              exit 0
            fi
            
            echo "Попытка $i: Сервис еще не готов (HTTP $HTTP_STATUS). Ожидание 15 секунд..."
            sleep 15
          done
          
          echo "Ошибка: Сервис не запустился за отведенное время (10 минут)."
          exit 1

